name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: zhijun-io/github-workflows/.github/workflows/ci.yml@main
    with:
      java-version: '25'
      upload-test-results: false
