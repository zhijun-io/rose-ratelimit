spring:
  application:
    name: rose-ratelimit-sample

rose:
  ratelimit:
    rules:
      - id: login-ip
        stage: FILTER
        path: /api/auth/login
        methods: [POST]
        capacity: 3
        refill-tokens: 3
        refill-period: 1m
        key-source: ip
        failure-mode: CLOSED
      - id: item-read
        stage: MVC
        path: /api/items
        methods: [GET]
        capacity: 5
        refill-tokens: 5
        refill-period: 10s
        key-source: ip
      - id: item-write
        stage: MVC
        path: /api/items
        methods: [POST]
        capacity: 2
        refill-tokens: 2
        refill-period: 1m
        key-source: ip
      - id: export
        stage: MVC
        capacity: 1
        refill-tokens: 1
        refill-period: 1m
        key-source: ip
